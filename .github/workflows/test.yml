name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lab: [rate-limiting, caching, consistent-hashing]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Test
        working-directory: labs/${{ matrix.lab }}
        run: go test -race -v ./...
      - name: Vet
        working-directory: labs/${{ matrix.lab }}
        run: go vet ./...
